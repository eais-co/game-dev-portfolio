<svg viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized tactical character silhouette, black armor with a glowing yellow visor and red trim">
  <defs>
    <linearGradient id="bodyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="55%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="coatFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="visorGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFEB80"/>
      <stop offset="45%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FFD000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="50%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FFD000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ambient glow behind figure -->
  <ellipse cx="330" cy="420" rx="260" ry="360" fill="url(#coreGlow)" opacity="0.08"/>

  <!-- trailing coat / cape, torn tactical panels -->
  <path d="M 210 300
           L 120 520
           L 90 760
           L 150 900
           L 230 760
           L 250 560
           Z" fill="url(#coatFade)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 430 300
           L 520 500
           L 545 740
           L 470 900
           L 410 720
           L 400 520
           Z" fill="url(#coatFade)" stroke="#1a1a1a" stroke-width="2"/>

  <!-- red trim lines on coat -->
  <path d="M 150 900 L 230 760" stroke="#C1121F" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 470 900 L 410 720" stroke="#C1121F" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- legs -->
  <path d="M 255 560
           L 235 780
           L 250 900
           L 300 900
           L 305 790
           L 320 600 Z" fill="url(#bodyFade)"/>
  <path d="M 385 560
           L 405 780
           L 395 900
           L 345 900
           L 335 790
           L 320 600 Z" fill="url(#bodyFade)"/>

  <!-- knee plates -->
  <path d="M 245 740 L 300 730 L 295 790 L 250 795 Z" fill="#111111" stroke="#222" stroke-width="2"/>
  <path d="M 395 740 L 340 730 L 345 790 L 390 795 Z" fill="#111111" stroke="#222" stroke-width="2"/>

  <!-- boots -->
  <rect x="242" y="890" width="66" height="26" rx="4" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="332" y="890" width="66" height="26" rx="4" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="2"/>

  <!-- torso -->
  <path d="M 250 330
           L 245 470
           L 260 590
           L 380 590
           L 395 470
           L 390 330
           L 320 300 Z" fill="url(#bodyFade)" stroke="#1a1a1a" stroke-width="2"/>

  <!-- chest armor plates -->
  <path d="M 270 350 L 320 340 L 320 470 L 275 470 Z" fill="#111111" stroke="#242424" stroke-width="1.5"/>
  <path d="M 370 350 L 320 340 L 320 470 L 365 470 Z" fill="#111111" stroke="#242424" stroke-width="1.5"/>

  <!-- glowing chest core -->
  <circle cx="320" cy="410" r="42" fill="url(#coreGlow)"/>
  <circle cx="320" cy="410" r="14" fill="#FFD000"/>
  <circle cx="320" cy="410" r="14" fill="none" stroke="#FFF3C4" stroke-width="1.5"/>

  <!-- red diagonal chest strap -->
  <path d="M 260 345 L 340 470" stroke="#C1121F" stroke-width="6" opacity="0.85"/>

  <!-- shoulder armor -->
  <path d="M 210 320 
           Q 250 285 300 305
           L 285 380
           Q 240 390 205 365 Z" fill="#101010" stroke="#252525" stroke-width="2"/>
  <path d="M 430 320
           Q 390 285 340 305
           L 355 380
           Q 400 390 435 365 Z" fill="#101010" stroke="#252525" stroke-width="2"/>

  <!-- shoulder red accent marks -->
  <path d="M 220 335 L 265 320" stroke="#C1121F" stroke-width="3"/>
  <path d="M 420 335 L 375 320" stroke="#C1121F" stroke-width="3"/>

  <!-- arms -->
  <path d="M 205 365 L 175 480 L 190 600 L 235 600 L 235 480 L 250 385 Z" fill="url(#bodyFade)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 435 365 L 465 480 L 450 600 L 405 600 L 405 480 L 390 385 Z" fill="url(#bodyFade)" stroke="#1a1a1a" stroke-width="2"/>

  <!-- gauntlets -->
  <rect x="182" y="590" width="58" height="34" rx="6" fill="#0e0e0e" stroke="#242424" stroke-width="2"/>
  <rect x="400" y="590" width="58" height="34" rx="6" fill="#0e0e0e" stroke="#242424" stroke-width="2"/>
  <rect x="192" y="600" width="10" height="14" fill="#FFD000" opacity="0.85"/>
  <rect x="438" y="600" width="10" height="14" fill="#FFD000" opacity="0.85"/>

  <!-- neck -->
  <rect x="300" y="285" width="40" height="30" fill="#0c0c0c"/>

  <!-- helmet -->
  <path d="M 260 190
           Q 260 130 320 122
           Q 380 130 380 190
           L 378 250
           Q 320 285 262 250 Z" fill="url(#bodyFade)" stroke="#1a1a1a" stroke-width="2"/>

  <!-- helmet crest -->
  <path d="M 315 122 L 325 122 L 322 90 L 318 90 Z" fill="#151515"/>

  <!-- visor glow -->
  <ellipse cx="320" cy="200" rx="70" ry="70" fill="url(#visorGlow)" opacity="0.35" filter="url(#softBlur)"/>
  <path d="M 275 195
           Q 320 178 365 195
           Q 360 215 320 220
           Q 280 215 275 195 Z" fill="#FFD000"/>
  <path d="M 275 195
           Q 320 178 365 195
           Q 360 215 320 220
           Q 280 215 275 195 Z" fill="none" stroke="#FFF3C4" stroke-width="1.5" opacity="0.6"/>

  <!-- helmet side vents -->
  <path d="M 262 210 L 250 225 L 262 235 Z" fill="#0a0a0a" stroke="#C1121F" stroke-width="1.5"/>
  <path d="M 378 210 L 390 225 L 378 235 Z" fill="#0a0a0a" stroke="#C1121F" stroke-width="1.5"/>

  <!-- thin HUD lines radiating from figure (decorative, matches brief) -->
  <g stroke="#FFD000" stroke-width="1" opacity="0.25">
    <line x1="60" y1="200" x2="150" y2="200"/>
    <line x1="500" y1="180" x2="580" y2="180"/>
    <line x1="70" y1="650" x2="140" y2="650"/>
  </g>
</svg>
